server:
  port: 8089
  servlet:
    context-path: /

spring:
  servlet:
    multipart:
      # AI 附件导入上传限制（默认 1MB 不够 Excel 导入场景）
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/dlyk?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    hikari:
      maximum-pool-size: 30
      minimum-idle: 20
      connection-timeout: 5000
      idle-timeout: 0
      #???????????????8??
      max-lifetime: 18000000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
# 设置返回json时的时区和格式
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss


mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    org.apache.ibatis: INFO

# JWT验证安全密钥配置
jwt:
  secret: dY8300olWQ3345;1d<3w48

# LangChain4j custom properties
ai:
  chat:
    base-url: https://ws-x0twjnq8ovd2ycdr.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api-key: ${AI_API_KEY:}  # 默认极客测试 Key
    model-name: qwen3.7-max-2026-06-08

#定时任务的调度时间
project:
  task:
    cron: '*/3 * * * * *'
    delay: 180000
    # AI 付费墙缓存对账周期（毫秒，默认 5 分钟）：
    # 周期性将 Redis 开通标记与数据库真相比对收敛，覆盖"绕过应用直改数据库"场景
    ai-reconcile-delay: 300000

